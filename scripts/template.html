<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
<meta name="theme-color" content="#000000">
<link rel="canonical" href="{{url}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="HabitFlame">
<meta property="og:locale" content="en_US">
<meta property="og:url" content="{{url}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{base}}/{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{og_image_alt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{base}}/{{og_image}}">
<link rel="icon" type="image/png" sizes="32x32" href="{{base}}/assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="{{base}}/assets/icons/apple-touch-icon-180.png">
<link rel="preload" href="{{base}}/{{font}}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{base}}/{{stylesheet}}?v={{css_version}}">
<script type="application/ld+json">{{jsonld}}</script>
</head>
<body class="{{body_class}}">
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <a class="brand" href="{{base}}/"><img class="brand-icon" src="{{base}}/assets/icons/icon-96.webp" width="28" height="28" alt="">HabitFlame</a>
  <nav class="top-links" aria-label="Site">
    <a class="top-guides" href="{{base}}/#guides">Guides</a>
    <a href="{{base}}/support">Support</a>
    <a class="store-link" href="{{app_store_url}}">App Store</a>
  </nav>
</header>
<main id="main">
{{main}}
</main>
<footer class="foot">
  <div class="foot-row">
    <nav class="foot-links" aria-label="Legal">
      <a href="{{base}}/support">Support</a>
      <a href="{{base}}/privacy-policy">Privacy Policy</a>
      <a href="{{base}}/terms-of-service">Terms of Service</a>
      <a href="mailto:{{contact_email}}">{{contact_email}}</a>
    </nav>
    <a class="badge" href="{{app_store_url}}"><img src="{{base}}/assets/app-store-badge.svg" width="120" height="40" alt="Download on the App Store"></a>
  </div>
  <div class="foot-row foot-small">
    <p class="foot-brand"><a href="{{brand_url}}">{{brand_footer}}</a></p>
    <p class="foot-copy">&copy; {{year}} HabitFlame</p>
  </div>
</footer>
</body>
</html>
